services:
  # 1. Standalone solver (Palace) - runs only as a one-off task (run)
  palace:
    image: anteny-palace:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.palace
    command: ["-np", "${PALACE_CORES:-4}", "/workspace/data/config.json"]
    mem_limit: ${PALACE_MEM_LIMIT:-11g}
    memswap_limit: ${PALACE_MEMSWAP_LIMIT:-31g}
    volumes:
      # When running `palace` from inside the `pipeline` container (Docker-out-of-Docker), `CONF_DIR` and `DATA_DIR`
      # must match absolute paths on the host (or run `python src/main.py` locally with only `palace` in Docker).
      - ${CONF_DIR:-.}:/workspace
      - ${DATA_DIR:-./data}:/workspace/data
    environment:
      - OMPI_ALLOW_RUN_AS_ROOT=1
      - OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    working_dir: /workspace
    profiles: ["worker"]

  # 2. Simulation orchestration and mesh generation service
  # Run: docker compose run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    env_file:
      - path: .env
        required: false
    volumes:
      # When running `palace` from inside the `pipeline` container (Docker-out-of-Docker), `CONF_DIR` and `DATA_DIR`
      # must match absolute paths on the host (or run `python src/main.py` locally with only `palace` in Docker).
      - ${CONF_DIR:-.}:/workspace
      - ${DATA_DIR:-./data}:/workspace/data
      - ${EXPORT_DIR:-./export}:/workspace/export
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    profiles: ["worker"]
    command: python src/sweep.py

  # 3. KiCad 10 CLI tool for Gerber manufacturing export and DRC check
  # Run: docker compose --profile kicad-export run --rm kicad
  # With variant profile: ANTENNA_PROFILE=<profile> docker compose --profile kicad-export run --rm kicad
  kicad:
    image: kicad/kicad:10.0
    volumes:
      - ${CONF_DIR:-.}:/workspace
      - ${EXPORT_DIR:-./export}:/workspace/export
    environment:
      - ANTENNA_PROFILE=${ANTENNA_PROFILE:-}
    working_dir: /workspace
    profiles: ["kicad-export"]
    command:
      - sh
      - -c
      - |
        set -e
        if [ -n "$$ANTENNA_PROFILE" ]; then
          PCB="/workspace/results/$$ANTENNA_PROFILE/kicad/antenna_model4_$$ANTENNA_PROFILE.kicad_pcb"
          OUT="/workspace/results/$$ANTENNA_PROFILE/kicad/gerber/"
        else
          PCB="/workspace/export/kicad/antenna_model4.kicad_pcb"
          OUT="/workspace/export/kicad/gerber/"
        fi
        mkdir -p "$$OUT"
        kicad-cli pcb export gerbers -o "$$OUT" "$$PCB"
        kicad-cli pcb export drill -o "$$OUT" "$$PCB"
