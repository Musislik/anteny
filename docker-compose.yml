services:
  # 1. Samotný solver (Palace) - spouští se pouze jako jednorázová úloha (run)
  palace:
    image: anteny-palace:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.palace
    command: ["-np", "${PALACE_CORES:-5}", "/workspace/data/config.json"]
    volumes:
      # Při spuštění `palace` zevnitř `pipeline` kontejneru (Docker-out-of-Docker) musí `CONF_DIR` a `DATA_DIR`
      # odpovídat absolutní cestě na hostiteli (nebo lze spouštět `python src/main.py` lokálně a pouze `palace` v Dockeru).
      - ${CONF_DIR:-.}:/workspace
      - ${DATA_DIR:-./data}:/workspace/data
    environment:
      - OMPI_ALLOW_RUN_AS_ROOT=1
      - OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    working_dir: /workspace
    profiles: ["worker"]

  # 2. Nástroj pro orchestraci simulací a generování sítě
  # Spuštění: docker compose run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    env_file:
      - path: .env
        required: false
    volumes:
      # Při spuštění `palace` zevnitř `pipeline` kontejneru (Docker-out-of-Docker) musí `CONF_DIR` a `DATA_DIR`
      # odpovídat absolutní cestě na hostiteli (nebo lze spouštět `python src/main.py` lokálně a pouze `palace` v Dockeru).
      - ${CONF_DIR:-.}:/workspace
      - ${DATA_DIR:-./data}:/workspace/data
      - ${EXPORT_DIR:-./export}:/workspace/export
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    profiles: ["worker"]
    command: python src/sweep.py
