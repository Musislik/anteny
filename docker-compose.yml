version: '3.8'

services:
  # 1. Samotný solver (Palace) - spouští se pouze jako jednorázová úloha (run)
  palace:
    build:
      context: .
      dockerfile: docker/Dockerfile.palace
    volumes:
      - ${CONF_DIR:-.}:/workspace
      - ${DATA_DIR:-./data}:/workspace/data
      - ${DATA_DIR:-./data}/postpro:/workspace/postpro
    environment:
      - OMPI_ALLOW_RUN_AS_ROOT=1
      - OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    working_dir: /workspace
    profiles: ["worker"]

  # 2. Průzkumník simulací (MLflow Web UI) - dlouhoběžící server
  # Spuštění: docker compose up -d mlflow
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////workspace/data/mlflow.db
      - CONF_DIR=${CONF_DIR:-.}
      - DATA_DIR=${DATA_DIR:-./data}
      - "MLFLOW_SERVER_ALLOWED_HOSTS=*"
      - "MLFLOW_SERVER_CORS_ALLOWED_ORIGINS=http://testudines-vm:5000"
    volumes:
      - ${CONF_DIR:-.}:/workspace
      - ${DATA_DIR:-./data}:/workspace/data
    working_dir: /workspace
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////workspace/data/mlflow.db --default-artifact-root /workspace/data/mlruns

  # 3. Nástroj pro orchestraci simulací a generování sítě
  # Spuštění: docker compose run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////workspace/data/mlflow.db
      - CONF_DIR=${CONF_DIR:-.}
      - DATA_DIR=${DATA_DIR:-./data}
    volumes:
      - ${CONF_DIR:-.}:/workspace
      - ${DATA_DIR:-./data}:/workspace/data
      - ${DATA_DIR:-./data}/postpro:/workspace/postpro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    profiles: ["worker"]
    command: python src/sweep.py
