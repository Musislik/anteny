version: '3.8'

services:
  # 1. Samotný solver (Palace) - spouští se pouze jako jednorázová úloha (run)
  palace:
    build:
      context: .
      dockerfile: Dockerfile.palace
    volumes:
      - .:/workspace
    working_dir: /workspace
    profiles: ["worker"]

  # 2. Průzkumník simulací (MLflow Web UI) - dlouhoběžící server
  # Spuštění: docker compose up -d mlflow
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    ports:
      - "5000:5000"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: mlflow ui --host 0.0.0.0 --port 5000

  # 3. Nástroj pro orchestraci simulací a generování sítě
  # Spuštění: docker compose run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    profiles: ["worker"]
    command: python sweep.py
